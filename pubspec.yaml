name: voice2law_app
description: Urdu and English legal information for Pakistan.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2
  intl: ^0.20.3
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  record: 6.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/legal_corpus.json
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/voice2law_logo.png
  adaptive_icon_background: '#053425'
  adaptive_icon_foreground: assets/images/voice2law_logo.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/images/voice2law_logo.png
    background_color: '#053425'
    theme_color: '#053425'
